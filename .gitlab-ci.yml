stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# ---------------------------------------------
# 1. TEST STAGE
# ---------------------------------------------
test:backend:
  stage: test
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache git build-base
    - cd be
  script:
    - go test -v -race -cover ./...

test:frontend:
  stage: test
  image: node:22-alpine
  before_script:
    - cd fe
  script:
    - npm ci
    - npm run build

lint:helm:
  stage: test
  image: alpine/helm:3.17.0
  script:
    - helm lint ./helm/kubenexus
    - helm template test ./helm/kubenexus

# ---------------------------------------------
# 2. BUILD & PUSH DOCKER IMAGES
# ---------------------------------------------
build:images:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  only:
    - main
    - master
    - tags
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/backend:latest" ./be
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/frontend:latest" ./fe
    - docker build -t "$CI_REGISTRY_IMAGE/migrate:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/migrate:latest" -f ./be/Dockerfile.migrate ./be
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"
    - docker push "$CI_REGISTRY_IMAGE/migrate:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/migrate:latest"

# ---------------------------------------------
# 3. DEPLOY STAGE (Optional)
# ---------------------------------------------
deploy:kubernetes:
  stage: deploy
  image: alpine/helm:3.17.0
  when: manual
  only:
    - main
    - master
  script:
    - helm upgrade --install kubenexus ./helm/kubenexus --namespace kubenexus --create-namespace
