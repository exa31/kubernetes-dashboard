name: KubeNexus Monorepo CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ==========================================
  # 1. QUALITY ASSURANCE & UNIT TESTS
  # ==========================================
  test-backend:
    name: Backend Lint & Test (Go 1.25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./be
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: be/go.sum

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Backend Tests
        run: go test -v -race -cover ./...

  test-frontend:
    name: Frontend Lint & Build (Vue 3 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Build Production Bundle
        run: npm run build

  lint-helm:
    name: Helm Chart Lint & Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint Helm Chart
        run: helm lint ./helm/kubenexus

      - name: Template Render Dry-Run
        run: helm template test-release ./helm/kubenexus

  # ==========================================
  # 2. BUILD & PUSH DOCKER IMAGES (PARALLEL MATRIX)
  # ==========================================
  build-and-push:
    name: Build & Push (${{ matrix.target.name }})
    needs: [ test-backend, test-frontend, lint-helm ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: backend
            context: ./be
            dockerfile: ./be/Dockerfile
            image: backend
          - name: frontend
            context: ./fe
            dockerfile: ./fe/Dockerfile
            image: frontend
          - name: migrate
            context: ./be
            dockerfile: ./be/Dockerfile.migrate
            image: migrate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.target.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}

  # ==========================================
  # 3. PACKAGE HELM CHART ARTIFACT
  # ==========================================
  package-helm:
    name: Package Helm Chart (.tgz)
    needs: [ lint-helm, build-and-push ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Package Chart
        run: |
          mkdir -p dist-chart
          helm package ./helm/kubenexus --destination dist-chart

      - name: Upload Helm Chart Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubenexus-helm-chart
          path: dist-chart/*.tgz
          retention-days: 30

      - name: Push Helm Chart to OCI Registry (GHCR)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
          helm push dist-chart/*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-chart/*.tgz
          generate_release_notes: true
