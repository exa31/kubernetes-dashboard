# Example: Custom Ingress with Let's Encrypt (Cert-Manager) for KubeNexus
# Replace 'dashboard.yourdomain.com' with your actual domain name.
# Replace 'letsencrypt-prod' with your Cert-Manager ClusterIssuer name.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubenexus-ingress
  namespace: kubenexus
  annotations:
    # 1. Otomatisasi Sertifikat SSL Let's Encrypt via Cert-Manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    acme.cert-manager.io/http01-edit-in-place: "true"

    # 2. Pengaturan Ingress NGINX Controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

    # 3. Timeout agar Web Terminal Container & Live Logs tidak terputus
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dashboard.yourdomain.com
      secretName: kubenexus-tls-cert
  rules:
    - host: dashboard.yourdomain.com
      http:
        paths:
          # CUKUP 1 PATH INI SAJA!
          # Nginx di dalam pod frontend sudah otomatis me-reverse-proxy:
          # - Request UI web (/) -> dilayani langsung oleh Vue 3
          # - Request API (/api) -> diteruskan otomatis ke backend di port 3001
          # - WebSocket (/api/v1/k8s/ws/) -> diteruskan otomatis ke backend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubenexus-frontend
                port:
                  number: 80
