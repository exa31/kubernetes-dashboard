{{- $secretName := printf "%s-secret" (include "kubenexus.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- /* Auto-generate JWT secret (32 chars) or reuse existing across upgrades */ -}}
{{- $jwtSecret := "" -}}
{{- if .Values.jwt.secret -}}
  {{- $jwtSecret = .Values.jwt.secret -}}
{{- else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "JWT_SECRET") -}}
  {{- $jwtSecret = index $existingSecret.data "JWT_SECRET" | b64dec -}}
{{- else -}}
  {{- $jwtSecret = randAlphaNum 32 -}}
{{- end -}}
{{- /* Auto-generate DB password (24 chars) or reuse existing across upgrades */ -}}
{{- $dbPassword := "" -}}
{{- if .Values.database.password -}}
  {{- $dbPassword = .Values.database.password -}}
{{- else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "DB_PASSWORD") -}}
  {{- $dbPassword = index $existingSecret.data "DB_PASSWORD" | b64dec -}}
{{- else -}}
  {{- $dbPassword = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenexus.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASSWORD: {{ $dbPassword | b64enc | quote }}
  JWT_SECRET: {{ $jwtSecret | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | b64enc | quote }}
