{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubenexus.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubenexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "kubenexus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "kubenexus.fullname" . }}-config
            - secretRef:
                name: {{ include "kubenexus.fullname" . }}-secret
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubenexus.fullname" . }}-secret
                  key: DB_PASSWORD
          args: ["-action=up"]
{{- end }}
